name: Fix Breeding Lab i18n aliases

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Patch Breeding Lab translation keys
        uses: actions/github-script@v7
        with:
          script: |
            const path = 'app/components/breeding/BreedingLabClient.tsx';
            const file = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: 'main',
            });
            const current = Buffer.from(file.data.content, 'base64').toString('utf8');
            const replacements = [
              ['t("lab.analyze")', 't("lab.generateAnalysis")'],
              ['t("lab.loginToSave")', '`${t("lab.signInPrompt")} ${t("lab.signInSuffix")}`'],
              ['t("lab.savedAnalyses")', 't("lab.savedAnalysesTitle")'],
              ['t("lab.openSaved")', 't("open")'],
              ['t("lab.deleteSaved")', 't("delete")'],
            ];
            let next = current;
            for (const [from, to] of replacements) next = next.replaceAll(from, to);
            if (next === current) {
              core.info('Breeding Lab i18n aliases already fixed.');
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Fix Breeding Lab translation key aliases',
              content: Buffer.from(next, 'utf8').toString('base64'),
              sha: file.data.sha,
              branch: 'main',
            });
            core.info('Patched BreedingLabClient.tsx.');
      - name: Remove temporary workflow
        uses: actions/github-script@v7
        with:
          script: |
            const path = '.github/workflows/fix-breeding-lab-i18n.yml';
            const file = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: 'main',
            });
            await github.rest.repos.deleteFile({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Remove temporary Breeding Lab i18n workflow',
              sha: file.data.sha,
              branch: 'main',
            });
            core.info('Temporary workflow removed.');
